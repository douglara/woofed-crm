# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On macOS with MacPorts:
#   gem install pg -- --with-pg-config=/opt/local/lib/postgresql84/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem 'pg'
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # Host/credentials come from DATABASE_URL; each config overrides only the
  # `database:` name. DATABASE_URL is auto-applied only to the primary, so the
  # ai_agent database would otherwise lose the host and fall back to a local
  # unix socket that does not exist in CI.
  url: <%= ENV["DATABASE_URL"] %>

primary: &primary
  <<: *default
  database: <%= "woofed_crm_#{Rails.env}" %>

# Session store for the woofed-ai-agent (agno). agno creates and owns its own
# tables at runtime, so Rails never manages a schema here. In production
# `db:create` provisions the empty database; in dev/test the agent does not run,
# so `database_tasks: false` keeps Rails from trying to create or load a schema
# for it (there is no `db/ai_agent_schema.rb`).
ai_agent: &ai_agent
  <<: *default
  database: <%= "woofed_ai_#{Rails.env}" %>
  migrations_paths: db/ai_agent_migrate

development:
  primary:
    <<: *primary
  ai_agent:
    <<: *ai_agent
    database_tasks: false

test:
  primary:
    <<: *primary
  ai_agent:
    <<: *ai_agent
    database_tasks: false

production:
  primary:
    <<: *primary
    url: <%= ENV['DATABASE_URL'] %>
  ai_agent:
    <<: *ai_agent
    url: <%= ENV['AI_AGENT_DATABASE_URL'] %>
