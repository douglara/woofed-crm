# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On macOS with MacPorts:
#   gem install pg -- --with-pg-config=/opt/local/lib/postgresql84/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem 'pg'
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

primary: &primary
  <<: *default
  database: <%= "woofed_crm_#{Rails.env}" %>

goodjob: &goodjob
  <<: *default
  database: <%= "woofed_crm_goodjob_#{Rails.env}" %>
  migrations_paths: db/good_job_migrate

# Session store for the woofed-ai-agent (agno). Rails only provisions the empty
# database (db:create); agno creates and owns its own tables at runtime, so the
# migrations path points at an empty directory to keep db:migrate a no-op here.
ai_agent: &ai_agent
  <<: *default
  database: <%= "woofed_ai_#{Rails.env}" %>
  migrations_paths: db/ai_agent_migrate

development:
  primary:
    <<: *primary
  goodjob:
    <<: *goodjob
  ai_agent:
    <<: *ai_agent

test:
  primary:
    <<: *primary
  goodjob:
    <<: *goodjob
  ai_agent:
    <<: *ai_agent

production:
  primary:
    <<: *primary
    url: <%= ENV['DATABASE_URL'] %>
  goodjob:
    <<: *goodjob
    url: <%= ENV['GOODJOB_DATABASE_URL'] || ENV['DATABASE_URL'] %>
  ai_agent:
    <<: *ai_agent
    url: <%= ENV['AI_AGENT_DATABASE_URL'] %>
