[supervisord]
nodaemon=true
loglevel=error

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /app/storage/postgresql/data
user=postgres
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:redis]
command=/usr/bin/redis-server
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:woofed_crm]
command=/app/bin/easyinstall
directory=/app
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:agent_ai]
; The agent self-SIGTERMs when Apps::AiAssistent changes (LISTEN/NOTIFY) so
; that the next process picks up the new model/api_key. autorestart=true is
; what makes that work — supervisord spawns a fresh worker each time.
; FRONTEND_URL / DATABASE_URL / RAILS_ENV are inherited from the container ENV.
command=/usr/local/bin/uv run main.py
directory=/app/ai-agent
autorestart=true
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
