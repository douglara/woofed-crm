[supervisord]
nodaemon=true
loglevel=error

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /app/storage/postgresql/data
user=postgres
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:redis]
command=/usr/bin/redis-server
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:woofed_crm]
command=/app/bin/easyinstall
directory=/app
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:agent_ai]
; The agent is stateless about config: model/llm_token/mcp_token arrive
; per request in factory_input, so there is nothing to reload at runtime.
; autorestart=true is plain crash recovery — supervisord respawns the worker
; if it exits. FRONTEND_URL / WOOFED_AI_DATABASE_URL / OS_SECURITY_KEY are
; inherited from the container ENV.
command=/usr/local/bin/uv run main.py
directory=/app/ai-agent
autorestart=true
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
